    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEC CSE Batch-17 Fund Tracker Website</title>
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var activeFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return activeFetch || realFetch; },
            set: function(v) { activeFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
